# Builds the game for Linux and Windows with GameCI (https://game.ci).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   content of the Unity_lic.ulf file (see docs/CI.md)
#   UNITY_EMAIL     Unity account email
#   UNITY_PASSWORD  Unity account password
#
# - On every push / pull request to main: builds and uploads the artifacts.
# - On a tag "v*" (e.g. v1.0.0): also publishes a GitHub Release with the zips.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_PATH: RPG
  BUILD_NAME: EldenPixel

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneLinux64
          - StandaloneWindows64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('RPG/Assets/**', 'RPG/Packages/**', 'RPG/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: Builds

      - name: Package
        run: |
          sudo chown -R "$USER" Builds
          cd Builds
          zip -qr "${BUILD_NAME}-${{ matrix.targetPlatform }}.zip" "${{ matrix.targetPlatform }}"
          ls -lh *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ matrix.targetPlatform }}
          path: Builds/${{ env.BUILD_NAME }}-${{ matrix.targetPlatform }}.zip
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
